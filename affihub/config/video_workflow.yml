shared:
  lease_duration_seconds: 60
  limits:
    source_file_max_bytes: 1073741824
    project_media_asset_max_bytes: 20971520
    render_segment_max_count: 50
    render_overlay_max_count: 20
    render_text_max_characters: 1000
    delogo_region_max_count: 20
  source_download:
    max_starts_per_window: 10
    window_seconds: 3600
    connect_timeout_seconds: 5
    proxy_bind_host: 127.0.0.1
    allowed_hosts:
      - youtube.com
      - youtube-nocookie.com
      - youtu.be
      - googlevideo.com
      - googleusercontent.com
      - facebook.com
      - fb.watch
      - fbcdn.net
      - fbsbx.com
      - instagram.com
      - cdninstagram.com
      - tiktok.com
      - tiktokv.com
      - tiktokcdn.com
      - tiktokcdn-us.com
    blocked_ip_ranges:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.0.2.0/24
      - 192.88.99.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 198.51.100.0/24
      - 203.0.113.0/24
      - 224.0.0.0/4
      - 240.0.0.0/4
      - "::/128"
      - "::1/128"
      - "::ffff:0:0/96"
      - 64:ff9b::/96
      - 64:ff9b:1::/48
      - 100::/64
      - 100:0:0:1::/64
      - 2001::/23
      - 2001:db8::/32
      - 2002::/16
      - 3fff::/20
      - 5f00::/16
      - fc00::/7
      - fe80::/10
      - fec0::/10
      - ff00::/8
  media:
    ffmpeg_command: ffmpeg
    ffmpeg_timeout_seconds: 1800
    ffmpeg_threads: 2
    ffmpeg_font_file: /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
    ffprobe_command: ffprobe
    ffprobe_timeout_seconds: 30
    ffprobe_max_output_bytes: 1048576
  render_profile:
    width: 1080
    height: 1920
    frame_rate: 30
    video_codec: libx264
    video_preset: veryfast
    audio_codec: aac
    video_crf: 23
  statuses:
    video_project:
      default: draft
      values:
        draft: draft
        processing: processing
        ready: ready
        failed: failed
    source_asset:
      default: pending
      values:
        pending: pending
        processing: processing
        ready: ready
        failed: failed
    render_version:
      default: pending
      values:
        pending: pending
        processing: processing
        ready: ready
        failed: failed
    publication:
      default: draft
      values:
        draft: draft
        approved: approved
        scheduled: scheduled
        uploading: uploading
        processing: processing
        published: published
        failed: failed
        outcome_unknown: outcome_unknown
        manual_outcome_confirmed: manual_outcome_confirmed
        manual_outcome_not_occurred: manual_outcome_not_occurred
    workflow_run:
      default: queued
      values:
        queued: queued
        running: running
        reconciliation_required: reconciliation_required
        outcome_unknown: outcome_unknown
        completed: completed
        failed: failed
    ai_generation:
      default: draft
      values:
        draft: draft
        script_ready: script_ready
        prompts_ready: prompts_ready
        submitting: submitting
        processing: processing
        reconciliation_required: reconciliation_required
        outcome_unknown: outcome_unknown
        completed: completed
        failed: failed
    ai_generation_scene:
      default: draft
      values:
        draft: draft
        submitting: submitting
        processing: processing
        reconciliation_required: reconciliation_required
        outcome_unknown: outcome_unknown
        completed: completed
        failed: failed
    outbound_attempt:
      default: prepared
      values:
        prepared: prepared
        submitting: submitting
        confirmed: confirmed
        failed: failed
        outcome_unknown: outcome_unknown
        manual_outcome_confirmed: manual_outcome_confirmed
        manual_outcome_not_occurred: manual_outcome_not_occurred
test:
  media:
    ffmpeg_command: ffmpeg
    ffmpeg_timeout_seconds: 15
    ffmpeg_threads: 2
    ffmpeg_font_file: /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
    ffprobe_command: ffprobe
    ffprobe_timeout_seconds: 1
    ffprobe_max_output_bytes: 1048576
